name: Codespace Control

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - start
          - stop
          - status
          - boot-agy

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - name: Control Codespace + boot AGY
        env:
          GH_TOKEN: ${{ secrets.CODESPACE_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing CODESPACE_TOKEN secret (classic PAT with codespace + repo scopes)."
            exit 1
          fi

          api() {
            curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          LIST=$(api "https://api.github.com/user/codespaces")
          NAME=$(echo "$LIST" | jq -r '.codespaces[]? | select(.repository.full_name=="Dcode9/antigravity-devbox") | .name' | head -n1)

          if [ -z "$NAME" ] || [ "$NAME" = "null" ]; then
            if [ "$ACTION" = "start" ] || [ "$ACTION" = "boot-agy" ]; then
              echo "Creating codespace..."
              api -X POST -H "Content-Type: application/json" \
                -d '{"repository_id":1375646022}' \
                "https://api.github.com/user/codespaces" | jq .
              # refresh name
              for i in $(seq 1 30); do
                sleep 5
                LIST=$(api "https://api.github.com/user/codespaces")
                NAME=$(echo "$LIST" | jq -r '.codespaces[]? | select(.repository.full_name=="Dcode9/antigravity-devbox") | .name' | head -n1)
                [ -n "$NAME" ] && [ "$NAME" != "null" ] && break
              done
            else
              echo "No codespace found."
              exit 0
            fi
          fi

          echo "Codespace: $NAME"
          STATE=$(echo "$LIST" | jq -r --arg n "$NAME" '.codespaces[]? | select(.name==$n) | .state')
          echo "State: ${STATE:-unknown}"

          wait_available() {
            for i in $(seq 1 60); do
              LIST=$(api "https://api.github.com/user/codespaces")
              STATE=$(echo "$LIST" | jq -r --arg n "$NAME" '.codespaces[]? | select(.name==$n) | .state')
              echo "wait [$i] state=$STATE"
              if [ "$STATE" = "Available" ]; then
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for Available"
            return 1
          }

          run_agy_boot() {
            echo "SSH into codespace and run start-remote.sh (no browser attach needed)..."
            # Ensure gh can talk to codespaces SSH
            gh codespace list || true
            # Retry SSH a few times — SSH may lag after Available
            for i in $(seq 1 12); do
              if gh codespace ssh -c "$NAME" -- 'bash -lc "cd /workspaces/antigravity-devbox 2>/dev/null || cd \"\$CODESPACE_VSCODE_FOLDER\" 2>/dev/null || cd ~; bash ./start-remote.sh; agy remote-control status || true; cat /tmp/agy-status.txt 2>/dev/null || true"'; then
                echo "AGY boot command finished OK"
                return 0
              fi
              echo "SSH attempt $i failed — retry in 10s"
              sleep 10
            done
            echo "SSH boot failed after retries"
            return 1
          }

          case "$ACTION" in
            status)
              echo "$LIST" | jq --arg n "$NAME" '.codespaces[]? | select(.name==$n)'
              ;;
            stop)
              if [ "$STATE" = "Shutdown" ] || [ "$STATE" = "Stopped" ]; then
                echo "Already stopped."
              else
                api -X POST "https://api.github.com/user/codespaces/$NAME/stop" | jq .
              fi
              ;;
            start|boot-agy)
              if [ "$STATE" != "Available" ] && [ "$STATE" != "Running" ]; then
                echo "Starting codespace..."
                api -X POST "https://api.github.com/user/codespaces/$NAME/start" | jq . || true
              else
                echo "Already up — will still boot AGY"
              fi
              wait_available
              run_agy_boot
              ;;
          esac
